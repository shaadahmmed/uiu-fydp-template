name: Build Typst reports
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.15.1'
      - run: python scripts/project.py package
      - uses: actions/upload-artifact@v4
        with:
          name: academic-uiu-fydp-reports-and-package
          path: |
            build/*.pdf
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
