name: Build Typst reports
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: ['0.15.1', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ matrix.compiler }}
      - run: python scripts/project.py package
      - uses: actions/upload-artifact@v4
        with:
          name: academic-uiu-fydp-${{ matrix.compiler }}
          path: |
            build/*.pdf
            dist/*.tar.gz
            dist/*.sha256
            dist/universe-pr.md
          if-no-files-found: error
